<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACHIEVQUIZ — Quiz Pembelajaran & Game Kelas SMA</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- CSS Kustom Terpisah -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-pink-100 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="app.navigate('home')">
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md">
          🏆
        </div>
        <div>
          <h1 class="font-display text-lg font-bold text-rose-500 leading-tight">ACHIEVQUIZ</h1>
          <p class="text-xs text-pink-400 font-medium">SMA Kelas 10, 11, 12 • Offline</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="streak-badge" class="px-3 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-700 text-xs font-semibold">
          🔥 1 Hari
        </span>
        <button id="btn-sound" onclick="app.toggleSound()" class="w-9 h-9 rounded-full bg-pink-50 hover:bg-pink-100 text-pink-600 flex items-center justify-center transition" title="Suara">
          🔊
        </button>
      </div>
    </div>
  </header>

  <!-- Konten Utama (SPA Container) -->
  <main id="app-root" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
    <!-- Konten dirender otomatis oleh app.js -->
  </main>

  <!-- JavaScript Terpisah -->
  <script src="app.js"></script>
</body>
</html>
